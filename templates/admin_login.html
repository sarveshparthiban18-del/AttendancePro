<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AttendancePro - Admin Login</title>
    <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
<meta name="theme-color" content="#6366f1">
    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            background: linear-gradient(135deg, #111827, #374151);

            padding: 20px;
        }

        .login-box {
            width: 400px;

            background: white;

            padding: 40px;

            border-radius: 20px;

            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
        }

        .logo {
            text-align: center;

            font-size: 30px;

            font-weight: bold;

            color: #111827;

            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;

            color: #6b7280;

            margin-bottom: 30px;
        }

        .admin-badge {
            text-align: center;

            margin-bottom: 25px;

            color: #2563eb;

            font-weight: bold;
        }

        .error {
            background: #fee2e2;

            color: #dc2626;

            padding: 12px;

            border-radius: 8px;

            text-align: center;

            margin-bottom: 20px;
        }

        label {
            display: block;

            margin-bottom: 8px;

            font-weight: bold;

            color: #374151;
        }

        input {
            width: 100%;

            padding: 14px;

            margin-bottom: 20px;

            border: 1px solid #d1d5db;

            border-radius: 10px;

            font-size: 15px;
        }

        input:focus {
            outline: none;

            border-color: #2563eb;
        }

        button {
            width: 100%;

            padding: 14px;

            border: none;

            border-radius: 10px;

            background: #111827;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;
        }

        button:hover {
            background: #1f2937;
        }

        .back {
            text-align: center;

            margin-top: 20px;
        }

        .back a {
            color: #2563eb;

            text-decoration: none;

            font-weight: bold;
        }

    </style>

</head>


<body>

    <div class="login-box">

        <div class="logo">
            AttendancePro
        </div>

        <div class="subtitle">
            College Attendance Management
        </div>

        <div class="admin-badge">
            ADMIN LOGIN
        </div>


        {% if error %}

        <div class="error">
            {{ error }}
        </div>

        {% endif %}


        <form method="POST" action="/admin/login">

            <label for="username">
                Admin Username
            </label>

            <input
                type="text"
                id="username"
                name="username"
                placeholder="Enter admin username"
                required
            >


            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter admin password"
                required
            >


            <button type="submit">
                Admin Login
            </button>

        </form>


        <div class="back">

            <a href="/">
                ← Back to Student Login
            </a>

        </div>

    </div>

</body>

</html>
