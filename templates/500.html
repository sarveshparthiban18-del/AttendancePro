<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Server Error - AttendancePro</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f4f6fb;
        }

        .box {
            background: white;
            padding: 45px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 5px 25px rgba(0,0,0,0.08);
            max-width: 500px;
        }

        h1 {
            font-size: 70px;
            color: #dc2626;
            margin-bottom: 10px;
        }

        h2 {
            margin-bottom: 10px;
        }

        p {
            color: #666;
            margin-bottom: 25px;
            line-height: 1.6;
        }

        a {
            display: inline-block;
            padding: 12px 22px;
            background: #4f46e5;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
        }

        a:hover {
            background: #3730a3;
        }

    </style>

</head>

<body>

    <div class="box">

        <h1>500</h1>

        <h2>Something Went Wrong ⚠️</h2>

        <p>
            AttendancePro encountered an unexpected error.
            Please try again later.
        </p>

        <a href="/">
            Go to Login
        </a>

    </div>

</body>

</html>
